name: Deploy Laravel to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd
        
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=ext-sodium
      
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      
    - name: Create .env file
      run: |
        cp .env.example .env
        touch database/database.sqlite
        php artisan key:generate
        php artisan migrate --force
        
    - name: Run Validations
      run: |
        php artisan config:cache
        php artisan route:cache

  deploy:
    runs-on: ubuntu-latest
    needs: laravel-tests
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd domains/cakramanggalapnm.com/public_html
          
          # Maintain maintenance mode
          php artisan down || true
          
          # Discard any local changes on the server to prevent merge conflicts
          git reset --hard
          
          # Pull latest code
          git pull origin main
          
          # Install dependencies (production mode)
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=ext-sodium
          
          # Database migration
          php artisan migrate --force
          
          # Clear and set caches
          php artisan optimize
          
          # Permissions (ignore failures from files owned by web server)
          chmod -R 775 storage bootstrap/cache || true
          
          # Bring up the app
          php artisan up
